plugin: aws_ec2
regions:
  - us-east-2
# added if targeting specific servers
filters:
  tag:Name: dev*                 # filter based on instance tag/name
  instance-state-name: running   # filter based on instance state

# Grouping servers by tag name and instance type
keyed_groups:
  - key: tags
    prefix: tag
  - key: instance_type
    prefix: instance_type